<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Internal Audit Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark left rail + light work area. Engagement pages follow an "audit file" pattern: header, key-date timeline on the left, methodology + execution on the right, then a tree of risks and controls. */
:root{
  --bg:#F2F5F5; --panel:#FFFFFF; --ink:#16222A; --muted:#5A6A72; --line:#D9E2E3; --line-soft:#E8EEEE;
  --accent:#16777A; --accent-soft:#DDF0F0; --accent-ink:#FFFFFF; --accent-2:#6CC9D3;
  --good:#1E9E61; --good-soft:#DDF3E8; --warn:#C98A06; --warn-soft:#FCF0D2;
  --bad:#D23C3C; --bad-soft:#FBE3E3; --info:#5B4FA6; --info-soft:#ECE9F8; --neutral-soft:#ECF0F1; --grey:#B9C3C6;
  --hl:#FFF7E1; --hl-line:#EAD8A2;
  --rail:#0F2229; --rail-ink:#A9BEC3; --rail-hi:#FFFFFF; --rail-sel:#1A3740;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1518; --panel:#142024; --ink:#E1EAEC; --muted:#93A6AC; --line:#26383D; --line-soft:#1E2E33;
  --accent:#4FB7BA; --accent-soft:#163538; --accent-ink:#0D1518; --accent-2:#3E8F98;
  --good:#4FC48B; --good-soft:#123326; --warn:#E5AE3E; --warn-soft:#382B10; --bad:#EE6E6E; --bad-soft:#3D1C1D;
  --info:#A79BE6; --info-soft:#26223F; --neutral-soft:#1C2A2F; --grey:#4A5C61; --hl:#29240F; --hl-line:#4C421E;
  --rail:#091113; --rail-ink:#8FA6AC; --rail-hi:#FFFFFF; --rail-sel:#17303A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1518; --panel:#142024; --ink:#E1EAEC; --muted:#93A6AC; --line:#26383D; --line-soft:#1E2E33;
  --accent:#4FB7BA; --accent-soft:#163538; --accent-ink:#0D1518; --accent-2:#3E8F98;
  --good:#4FC48B; --good-soft:#123326; --warn:#E5AE3E; --warn-soft:#382B10; --bad:#EE6E6E; --bad-soft:#3D1C1D;
  --info:#A79BE6; --info-soft:#26223F; --neutral-soft:#1C2A2F; --grey:#4A5C61; --hl:#29240F; --hl-line:#4C421E;
  --rail:#091113; --rail-ink:#8FA6AC; --rail-hi:#FFFFFF; --rail-sel:#17303A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{padding:0 8px;color:var(--rail-hi)}
.brand b{display:block;font-size:15px}
.brand span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--rail-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:6px;color:var(--rail-ink)}
.nav button small{display:block;font-size:11px;opacity:.75}
.nav button:hover{color:var(--rail-hi)}
.nav button[aria-current="page"]{background:var(--rail-sel);color:var(--rail-hi);box-shadow:inset 3px 0 0 var(--accent-2)}
.nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.tg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.railnote{margin-top:auto;font-size:11.5px;padding:10px;border:1px dashed #33505A;border-radius:6px}

.main{min-width:0;padding-block:20px 48px;padding-inline:28px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.top h1{margin:0;font-size:22px;font-weight:600;text-wrap:balance}
.top .vi{color:var(--muted);font-size:13px}
.who{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.who label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.scope{font-size:12.5px;color:var(--muted)}
.scope b{color:var(--ink);font-weight:500}

.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.filters .f{display:flex;flex-direction:column;gap:3px;min-width:0}
.filters label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
select,input[type=date],input[type=text],input[type=email],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:54px}
.filters .reset{align-self:end}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .count{color:var(--muted);font-size:13px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}

.section{display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sechead h2{margin:0;font-size:17px;font-weight:600}
.sechead q{quotes:none;color:var(--muted);font-size:13px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad{border-top-color:var(--bad)} .kpi.warn{border-top-color:var(--warn)} .kpi.good{border-top-color:var(--good)} .kpi.acc{border-top-color:var(--accent)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.panel h3 small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.h3wrap{display:flex;flex-direction:column}
.help{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:50%;font-size:10px;color:var(--muted);font-weight:600;cursor:help}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;max-width:640px;height:auto;display:block}
svg.chart text{font-family:var(--font-ui);fill:var(--muted);font-size:11px}
svg.chart .lab{fill:var(--ink)} svg.chart .val{fill:var(--ink);font-weight:600}
.scroll{overflow-x:auto}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);z-index:1}
tbody tr:hover > td{background:var(--neutral-soft)}
td.wrap{white-space:normal;min-width:230px;max-width:360px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.code{font-family:var(--font-mono);font-size:12px}
th.fu,td.fu{background:var(--hl)}
th.fu{border-bottom-color:var(--hl-line)}
th .tag{display:inline-block;margin-left:5px;font-size:10px;font-weight:500;padding:0 5px;border-radius:3px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
th .tag.sg{background:var(--info-soft);color:var(--info)}
td.ed{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.ed.fu{background:var(--hl)}
td select,td input,td textarea{font-size:12.5px;padding:3px 6px;min-width:110px}
td textarea{min-width:220px;min-height:38px}
td input[type=date]{min-width:132px}
.lock{color:var(--muted);font-size:11px;margin-left:4px}

.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--neutral-soft);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.heat{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:4px;font-size:12px}
.heat .ax{color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.heat .cell{border-radius:6px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--neutral-soft);color:var(--muted)}
.heat .cell b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.heat .cell.r1{background:var(--good-soft)} .heat .cell.r2{background:var(--warn-soft)} .heat .cell.r3{background:var(--bad-soft)}
.heat .cell .w{font-size:11px;color:var(--bad)}
.list .row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);align-items:baseline;font-size:13px}
.list .row:last-child{border-bottom:0}
.banner{border:1px solid var(--line);background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px}
.banner .vi{color:var(--muted)}

/* engagement page */
.crumb{font-size:13px;color:var(--muted)}
.ehead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.etitle{display:flex;gap:14px;align-items:center;min-width:0}
.folder{width:52px;height:52px;border-radius:10px;background:var(--neutral-soft);display:grid;place-items:center;flex:none}
.etitle h1{margin:0;font-size:21px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.eacts{display:flex;gap:8px;flex-wrap:wrap}
.elayout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.ecol{display:flex;flex-direction:column;gap:16px;min-width:0}
.kd{display:flex;flex-direction:column;padding:6px 0}
.kd .ms{display:grid;grid-template-columns:1fr 22px 1fr;column-gap:12px;min-height:76px}
.kd .ms .rail2{display:flex;justify-content:center;background:linear-gradient(var(--grey),var(--grey)) center top/2px 100% no-repeat}
.kd .ms:first-child .rail2{background-position:center 11px} .kd .ms:last-child .rail2{background-size:2px 12px}
.kd .dot{position:relative;width:18px;height:18px;border-radius:50%;background:var(--grey);margin-top:2px;z-index:1}
.kd .dot.late{background:var(--bad)} .kd .dot.early{background:var(--good)} .kd .dot.od{background:var(--panel);border:3px solid var(--bad)}
.kd .lab{font-size:13.5px;padding-bottom:14px}
.kd .lab b{display:block;font-size:12.5px;margin-top:1px}
.kd .lab .pl{font-size:11.5px;color:var(--muted)}
.kd .left{text-align:right} .kd .left .lab{text-align:right}
.badge{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;color:#fff;background:var(--bad)}
.badge.early{background:var(--good)} .badge.od{background:var(--panel);color:var(--bad);border:1.5px solid var(--bad)}
.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 2px}
.step{flex:1 1 0;min-width:84px;display:flex;flex-direction:column;gap:6px;position:relative}
.step .node{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--grey);color:#fff;font-size:12px;position:relative;z-index:1}
.step.done .node{background:var(--good)} .step.cur .node{background:var(--accent-2);color:var(--rail)}
.step::after{content:"";position:absolute;top:10px;left:26px;right:4px;height:2px;background:var(--line)}
.step.done::after{background:var(--accent-2)} .step:last-child::after{display:none}
.step:last-child{flex:0 0 auto;align-items:flex-end;text-align:right}
.step span{font-size:13.5px;color:var(--accent);font-weight:500} .step.todo span{color:var(--muted)}
.prog .pct{display:inline-block;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;position:relative;height:16px}
.prog .bar{height:8px;background:var(--neutral-soft);border-radius:999px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px}
.counter{display:flex;align-items:center;gap:8px;min-width:0}
.counter .ic{width:32px;height:32px;border-radius:8px;background:var(--neutral-soft);display:grid;place-items:center;flex:none}
.counter b{font-variant-numeric:tabular-nums;font-size:14px;display:block}
.counter small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px 18px;font-size:13px}
.dl div > span.k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tree td{vertical-align:middle}
.tt{display:flex;align-items:center;gap:8px;min-width:0}
.tg{all:unset;cursor:pointer;width:18px;height:18px;display:grid;place-items:center;color:var(--muted);border-radius:4px;flex:none}
.tg.sp{cursor:default}
.sic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;color:#fff;background:var(--accent-2)}
.sic.ok{background:var(--good)} .sic.iss{background:var(--warn)}
.tico{flex:none;color:var(--muted)}
.tt .ttl{color:var(--accent);font-weight:500;white-space:normal}
.tt .ttl.l2{color:var(--ink);font-weight:400}
.outc{display:flex;align-items:center;gap:6px}
.outc i{display:inline-block;width:26px;height:12px;border-radius:999px}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:10.5px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
tr.det > td{background:var(--neutral-soft)}
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:10px 16px;padding:6px 4px 10px 52px;white-space:normal}
.detgrid .fld{display:flex;flex-direction:column;gap:3px;font-size:13px}
.detgrid .fld > span.k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.detgrid .fld.full{grid-column:1/-1}
.xbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.xbar input[type=search]{max-width:240px}
.xbar select{width:auto}

/* admin */
.matrix select{min-width:110px}
.pv{font-weight:600}
.pv-Edit,.pv-Full{color:var(--good)} .pv-View{color:var(--accent)} .pv-Hidden,.pv-No{color:var(--muted)}
td.pc-Edit,td.pc-Full{background:var(--good-soft)} td.pc-EditOwn{background:color-mix(in srgb,var(--good-soft) 50%,transparent)} td.pc-View{background:var(--accent-soft)} td.pc-Hidden,td.pc-No{background:var(--neutral-soft)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:10px}
.roles .panel{gap:4px}
.roles .panel b{font-size:14px}
.roles .panel span{font-size:12.5px;color:var(--muted)}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:12px}
.lists table{font-size:12.5px}
.lists td,.lists th{padding:5px 8px}
.kind{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
.kind.Editable{background:var(--good-soft);color:var(--good)} .kind.Fixed{background:var(--warn-soft);color:var(--warn)} .kind.Auto{background:var(--neutral-soft);color:var(--muted)}
.addval{display:grid;grid-template-columns:80px 1fr 1fr auto;gap:6px}

.modal{position:fixed;inset:0;background:rgba(8,16,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(740px,100%);display:flex;flex-direction:column}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet h3{margin:0;font-size:16px}
.sheet form{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}
.sheet .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.sheet .fld label{font-size:12px;color:var(--muted)}
.sheet .fld.full{grid-column:1/-1}
.sheet .note{font-size:12px;color:var(--muted)}
.sheet .err{grid-column:1/-1;color:var(--bad);font-size:13px}
.sheet .acts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:30}

@media (max-width:980px){ .elayout{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:12px 16px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap} .nav button small{display:none}
  .railnote{display:none}
  .main{padding-inline:16px}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detgrid{padding-left:8px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><span>Internal Audit</span><b>Audit Workspace</b></div>
    <nav class="nav" id="nav" aria-label="Modules"></nav>
    <div class="railnote">Demo with sample data. Changes stay until the page is reloaded. Today is fixed at 15 Oct 2026.<br><br>Bản demo dùng dữ liệu mẫu. Thay đổi được giữ đến khi tải lại trang.</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle"></h3><button class="btn" id="mClose" type="button">Close</button></header>
    <form id="mForm" novalidate></form>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   Helpers
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY = new Date(2026, 9, 15), TODAY_S = '2026-10-15';
const D = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

function issueCalc(i){
  const due = i.revised || i.due, dueD = D(due);
  if (i.completion){ const late = Math.max(0, dd(D(i.completion), dueD));
    return {status: late>0?'Completed late':'Completed on time', overdue:'', days:late, open:false, overdueNow:false, curDue:due}; }
  const late = dd(TODAY, dueD);
  if (late <= 0) return {status:'Open - on schedule', overdue:'Open', days:0, open:true, overdueNow:false, curDue:due};
  return {status: late<=90?'Open - up to 3 months overdue':'Open - more than 3 months overdue', overdue:'Past due date', days:late, open:true, overdueNow:true, curDue:due};
}
function schedCalc(e){
  if (['Cancelled','Deferred'].includes(e.status)) return '—';
  const pe = D(e.pEnd);
  if (e.aEnd) return D(e.aEnd) > pe ? 'Delayed' : 'On track';
  if (TODAY > pe) return 'Delayed';
  if (dd(pe, TODAY) <= 14) return 'At risk';
  if (e.status === 'Not started' && TODAY > D(e.pStart)) return 'At risk';
  return 'On track';
}
function engCounts(e){
  const is = DB.issues.filter(i=>i.eng===e.code).map(i=>({...i,c:issueCalc(i)}));
  return {n:is.length, high:cnt(is,i=>i.rating==='High'), mod:cnt(is,i=>i.rating==='Moderate'), low:cnt(is,i=>i.rating==='Low'), pi:cnt(is,i=>i.rating==='Process Improvement'),
    open:cnt(is,i=>i.c.open), over:cnt(is,i=>i.c.overdueNow), closed:cnt(is,i=>!i.c.open)};
}
function rcmCalc(r){
  const score = r.L * r.I, rating = score>=6?'High':score>=3?'Moderate':'Low';
  let overall;
  if (!r.ctrl) overall='No Control';
  else if (r.testable==='N') overall='Unable to Test';
  else if (r.design==='Ineffective' || r.operating==='Ineffective') overall='Ineffective';
  else if (!r.operating) overall='Not Tested Yet';
  else overall='Effective';
  return {score, rating, overall};
}

  if (f.pStart && e.pStart < f.pStart) return false; if (f.pEnd && e.pEnd > f.pEnd) return false;

/* cols: {h, f?, m?, v(r,i), auto, sg, num, wrap, code, cls} — f + m enable permission-aware inline editing and hiding */
function table(cols, rows, opts={}){
  const vis = cols.filter(c => !(c.f && c.m) || visible(c.m, c.f));
  if (!rows.length) return `<div class="tbl"><div class="empty" style="padding:14px">No records match the filters. / Không có dữ liệu phù hợp với bộ lọc.</div></div>`;
  const th = vis.map(c=>`<th class="${c.cls||''}${c.num?' num':''}">${esc(c.h)}${c.auto?'<span class="tag">auto</span>':''}${c.sg?'<span class="tag sg">suggested</span>':''}</th>`).join('');
  const tr = rows.map((r,ix)=>`<tr>${vis.map(c=>{
    const editable = c.f && c.m && canEdit(c.m, c.f, r);
    const body = editable ? editor(c.m, r, c.f) : c.v(r, ix);
    return `<td class="${c.cls||''}${c.num?' num':''}${c.wrap&&!editable?' wrap':''}${c.code?' code':''}${editable?' ed':''}">${body}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tbl"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function permNote(m){
  const r = me().role, eds = FIELDS[m].rows.filter(([k])=>['Edit','Edit (own)'].includes(fpv(m,k))).map(x=>x[1]);

const C = {acc:'var(--accent)',good:'var(--good)',warn:'var(--warn)',bad:'var(--bad)',info:'var(--info)',muted:'var(--muted)',soft:'var(--neutral-soft)'};
function hbars(rows){
  if (!rows.length || rows.every(r=>!r.v)) return '<div class="empty">No data / Không có dữ liệu</div>';
  const W=480, LW=150, RH=26, max=Math.max(...rows.map(r=>r.v),1), H=rows.length*RH+6, bw=W-LW-40;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${rows.map((r,i)=>{const y=i*RH+4,w=Math.max(r.v?3:0,r.v/max*bw);
    return `<text class="lab" x="${LW-8}" y="${y+14}" text-anchor="end">${esc(r.l)}</text><rect x="${LW}" y="${y+3}" width="${bw}" height="16" rx="3" style="fill:var(--neutral-soft)"/><rect x="${LW}" y="${y+3}" width="${w}" height="16" rx="3" style="fill:${r.c||C.acc}"/><text class="val" x="${LW+w+6}" y="${y+15}">${r.v}</text>`;}).join('')}</svg>`;
}
function stacked(rows, keys){
  if (!rows.length) return '<div class="empty">No data / Không có dữ liệu</div>';
  const W=480, LW=150, RH=28, H=rows.length*RH+6, bw=W-LW-36, max=Math.max(...rows.map(r=>keys.reduce((s,k)=>s+(r.v[k.k]||0),0)),1);
  return legend(keys.map(k=>[k.l,k.c])) + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${rows.map((r,i)=>{
    const y=i*RH+4; let x=LW; const tot=keys.reduce((s,k)=>s+(r.v[k.k]||0),0);
    const segs = keys.map(k=>{const v=r.v[k.k]||0; if(!v) return ''; const w=v/max*bw; const s=`<rect x="${x}" y="${y+3}" width="${Math.max(w-1,1)}" height="18" style="fill:${k.c}"><title>${esc(k.l)}: ${v}</title></rect>${w>16?`<text x="${x+w/2}" y="${y+16}" text-anchor="middle" style="fill:var(--panel);font-size:10.5px;font-weight:600">${v}</text>`:''}`; x+=w; return s;}).join('');
    return `<text class="lab" x="${LW-8}" y="${y+16}" text-anchor="end">${esc(r.l)}</text>${segs}<text class="val" x="${x+6}" y="${y+16}">${tot}</text>`;}).join('')}</svg>`;
}
function cumLine(engs){
  const live = engs.filter(e=>!['Cancelled','Deferred'].includes(e.status)), curM = TODAY.getMonth();
  let p=0,a=0; const P=[],A=[];
  for (let m=0;m<12;m++){ p+=cnt(live,e=>D(e.pEnd).getMonth()===m); P.push(p); a+=cnt(live,e=>e.aEnd&&D(e.aEnd).getMonth()===m); A.push(m<=curM?a:null); }
  const W=480,H=200,l=30,r=14,t=14,b=28,max=Math.max(...P,1), X=m=>l+m*(W-l-r)/11, Y=v=>t+(H-t-b)*(1-v/max);
  const path = arr => arr.map((v,m)=>v==null?'':`${m&&arr[m-1]!=null?'L':'M'}${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const la = A.reduce((k,v,i)=>v!=null?i:k,0);
  return legend([['Planned (cumulative)',C.muted],['Actual reports issued',C.acc]]) + `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
   ${[0,Math.ceil(max/2),max].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line-soft)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
   ${MON.map((mn,m)=>`<text x="${X(m)}" y="${H-8}" text-anchor="middle">${mn}</text>`).join('')}
   <path d="${path(P)}" style="fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4"/><path d="${path(A)}" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>
   <circle cx="${X(la)}" cy="${Y(A[la])}" r="4" style="fill:var(--accent)"/><text class="val" x="${X(la)+7}" y="${Y(A[la])+4}">${A[la]} of ${P[la]}</text></svg>`;
}
function gantt(engs){
  if (!engs.length) return '<div class="empty">No data / Không có dữ liệu</div>';
  const W=820, LW=200, RH=24, t=22, H=t+engs.length*RH+8, y0=new Date(2026,0,1), y1=new Date(2026,11,31);
  const X = d => LW+(W-LW-10)*Math.min(Math.max((d-y0)/(y1-y0),0),1), col = s => ({'On track':C.good,'At risk':C.warn,'Delayed':C.bad})[s]||C.muted;
  return legend([['Planned period',C.soft],['Actual – On track',C.good],['Actual – At risk',C.warn],['Actual – Delayed',C.bad]]) +
  `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:640px;max-width:none" role="img">
   ${MON.map((m,i)=>{const x=X(new Date(2026,i,1)); return `<line x1="${x}" x2="${x}" y1="${t-4}" y2="${H}" style="stroke:var(--line-soft)"/><text x="${x+4}" y="${t-8}">${m}</text>`;}).join('')}
   ${engs.map((e,i)=>{const y=t+i*RH, s=schedCalc(e);
     return `<text class="lab" x="${LW-8}" y="${y+16}" text-anchor="end">${esc(e.code)} ${esc(e.name.length>18?e.name.slice(0,17)+'…':e.name)}</text>
     <rect x="${X(D(e.pStart))}" y="${y+4}" width="${Math.max(X(D(e.pEnd))-X(D(e.pStart)),2)}" height="15" rx="3" style="fill:var(--neutral-soft);stroke:var(--line)"/>
     ${e.aStart?`<rect x="${X(D(e.aStart))}" y="${y+8}" width="${Math.max(X(e.aEnd?D(e.aEnd):TODAY)-X(D(e.aStart)),2)}" height="7" rx="2" style="fill:${col(s)}"/>`:''}`;}).join('')}
   <line x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${t-4}" y2="${H}" style="stroke:var(--accent);stroke-dasharray:4 3"/><text x="${X(TODAY)+4}" y="${H-4}" style="fill:var(--accent)">Today</text></svg></div>`;
}

const MSF = [['Start planning',0],['Start fieldwork',.2],['Complete fieldwork',.65],['Issue draft report',.82],['Publish final report',1]];
const REACHED = {'Not started':0,'Planning':1,'Fieldwork':2,'Draft Report':3,'Final Report Issued':5,'Cancelled':0,'Deferred':0};
function milestones(e){
  const ps=D(e.pStart), pe=D(e.pEnd), span=pe-ps, reached=REACHED[e.status]??0;
  const as=e.aStart?D(e.aStart):null, ae=e.aEnd?D(e.aEnd):null, delay=as?dd(as,ps):0;
  return MSF.map(([l,f],i)=>{
    const p = dayOnly(new Date(ps.getTime()+span*f));
    let a = null;
    if (i < reached){
      if (i===0 && as) a = as;
      else if (as && ae) a = dayOnly(new Date(as.getTime()+(ae-as)*f));
      else a = dayOnly(new Date(p.getTime()+delay*86400000));
      if (a > TODAY) a = TODAY;
    }
    return {l, p, a, diff: a ? dd(a,p) : null, od: !a && p < TODAY && !['Cancelled','Deferred'].includes(e.status) ? dd(TODAY,p) : 0};
  });
}
function keyDates(e){
  const ms = milestones(e);
  return `<div class="kd">${ms.map((m,i)=>{
    const cls = m.a ? (m.diff>0?'late':'early') : (m.od?'od':'');
    const badge = m.a ? (m.diff>0?`<span class="badge">${m.diff} day${m.diff>1?'s':''} late</span>`:m.diff<0?`<span class="badge early">${-m.diff} day${m.diff<-1?'s':''} early</span>`:`<span class="badge early">On time</span>`)
                      : (m.od?`<span class="badge od">${m.od} day${m.od>1?'s':''} overdue</span>`:'');
    const lab = `<div class="lab">${esc(m.l)}<b>${fdD(m.a||m.p)}</b>${m.a?`<span class="pl">Planned ${fdD(m.p)}</span><br>`:'<span class="pl">Planned</span><br>'}${badge}</div>`;
    const left = i%2===0;
    return `<div class="ms"><div class="left">${left?lab:''}</div><div class="rail2"><span class="dot ${cls}" title="${esc(m.l)}"></span></div><div>${left?'':lab}</div></div>`;
  }).join('')}</div>`;
}
function methodology(e){
  const steps = ['Planning','Fieldwork','Reporting','Wrap Up'];
  const cur = {'Not started':-1,'Planning':0,'Fieldwork':1,'Draft Report':2,'Final Report Issued':3,'Cancelled':-2,'Deferred':-2}[e.status];

  return `<div class="stepper">${steps.map((s,i)=>{
    let st = 'todo';
    if (cur>=0){ if (i<cur) st='done'; else if (i===cur) st = (i===3&&allClosed)?'done':'cur'; }

let FORM = null;
function fieldHTML(f, v){
  const id = 'm-'+f.k, val = v[f.k] ?? '';
  let ctl;
  if (f.t==='select'||f.t==='multi'){ const o = f.opts(v), sel = x => f.t==='multi' ? (val||[]).includes(x) : String(val)===String(x);
    ctl = `<select id="${id}" name="${f.k}"${f.t==='multi'?' multiple size="4"':''}${f.ro?' disabled':''}>${f.t==='select'?'<option value="">— Select —</option>':''}${o.map(([x,t])=>`<option value="${esc(x)}"${sel(x)?' selected':''}>${esc(t)}</option>`).join('')}</select>`; }
  else if (f.t==='area') ctl = `<textarea id="${id}" name="${f.k}"${f.ro?' readonly':''}>${esc(val)}</textarea>`;
  else ctl = `<input type="${f.t}" id="${id}" name="${f.k}" value="${esc(val)}"${f.ro?' readonly':''}>`;
  return `<div class="fld${f.full?' full':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${ctl}${f.note?`<span class="note">${esc(f.note)}</span>`:''}</div>`;
}
function readForm(){ const v = {...FORM.vals}; FORM.fields.forEach(f=>{ const el=document.getElementById('m-'+f.k); if(!el||f.ro) return; v[f.k] = f.t==='multi'?[...el.selectedOptions].map(o=>o.value):el.value.trim(); }); return v; }
function drawForm(err){ document.getElementById('mForm').innerHTML = FORM.fields.map(f=>fieldHTML(f,FORM.vals)).join('') + (err?`<div class="err" role="alert">${esc(err)}</div>`:'') + `<div class="acts"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn primary" type="submit">Save</button></div>`; }
function openForm(title, fields, vals, onSave){ FORM = {fields, vals:{...vals}, onSave}; document.getElementById('mTitle').textContent = title; drawForm(); document.getElementById('modal').hidden = false; const f=document.querySelector('#mForm input:not([readonly]),#mForm select,#mForm textarea'); if (f) f.focus(); }
function closeForm(){ document.getElementById('modal').hidden = true; FORM = null; }
document.getElementById('mForm').addEventListener('change', e=>{
  const f = FORM && FORM.fields.find(x=>'m-'+x.k===e.target.id);
  if (f && f.cascade){ FORM.vals = readForm(); FORM.fields.slice(FORM.fields.indexOf(f)+1).forEach(x=>{ if (x.opts){ const ok=x.opts(FORM.vals).map(o=>String(o[0])); if (x.t==='multi') FORM.vals[x.k]=(FORM.vals[x.k]||[]).filter(c=>ok.includes(c)); else if (!ok.includes(String(FORM.vals[x.k]))) FORM.vals[x.k]=''; }}); drawForm(); document.getElementById(e.target.id).focus(); }
});
document.getElementById('mForm').addEventListener('submit', e=>{
  e.preventDefault(); const v = readForm();
  const miss = FORM.fields.filter(f=>f.req&&!f.ro&&(Array.isArray(v[f.k])?!v[f.k].length:!v[f.k]));
  if (miss.length){ FORM.vals=v; drawForm('Please fill in: '+miss.map(f=>f.l).join(', ')+'. / Vui lòng nhập đủ các trường bắt buộc.'); return; }
  const err = FORM.onSave(v); if (err){ FORM.vals=v; drawForm(err); return; }
  closeForm(); render();
});
document.getElementById('mClose').addEventListener('click', closeForm);
document.getElementById('modal').addEventListener('click', e=>{ if (e.target.id==='modal'||e.target.id==='mCancel') closeForm(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !document.getElementById('modal').hidden) closeForm(); });

  {k:'office',l:'Office',t:'select',opts:v=>DB.offices.filter(o=>o.company===v.company&&o.status==='Active').map(o=>[o.code,o.name]),req:1,cascade:1},
  {k:'depts',l:'Department (one or more)',t:'multi',opts:v=>DB.departments.filter(d=>d.office===v.office&&d.status==='Active').map(d=>[d.code,d.name]),req:1},
  {k:'scope',l:'Audit Scope',t:'select',opts:()=>DB.scopes.filter(s=>s.status==='Active').map(s=>[s.code,s.name]),req:1},
  {k:'pStart',l:'Planned Start Date',t:'date',req:1},{k:'pEnd',l:'Planned End Date',t:'date',req:1},
  {k:'aic',l:'Auditor In Charge',t:'select',opts:auditorOpts,req:1},{k:'team',l:'Team members',t:'multi',opts:auditorOpts},
  {k:'owner',l:'Process Owner',t:'select',opts:userOpts,req:1},{k:'priority',l:'Engagement Priority',t:'select',opts:listOpts('Engagement Priority'),req:1}];
function nextCode(prefix, arr, key){ const n = arr.filter(x=>x[key].startsWith(prefix)).map(x=>+x[key].slice(prefix.length)).reduce((a,b)=>Math.max(a,b||0),0)+1; return prefix+String(n).padStart(2,'0'); }
function newEngagement(){
  openForm('New engagement / Tạo cuộc kiểm toán', ENG_FIELDS, {code:'(created on save)',year:'2026',type:'Planned',priority:'Moderate',depts:[],team:[]}, v=>{
    if (v.pEnd < v.pStart) return 'Planned End Date must be after Planned Start Date.';
    const code = nextCode(`IA-${v.year}-`, DB.engagements, 'code');
    DB.engagements.push({...v, code, status:'Not started', aStart:'', aEnd:''}); log('Annual Plan', code, 'Engagement', '', 'Created'); toast(`Created ${code}`);
  });
}
function editEngagement(code){
  const e = L.eng(code);
  openForm(`${code} · Edit details`, ENG_FIELDS, {...e}, v=>{
    if (v.pEnd < v.pStart) return 'Planned End Date must be after Planned Start Date.';
    ENG_FIELDS.forEach(f=>{ if (!f.ro && JSON.stringify(e[f.k])!==JSON.stringify(v[f.k])) log('Annual Plan', code, f.l, [].concat(e[f.k]).join(', '), [].concat(v[f.k]).join(', ')); });
    Object.assign(e, v, {code}); toast(`Saved ${code}`);
  });
}
function updateProgress(code){
  const e = L.eng(code);
  const fields = [{k:'status',l:'Engagement Status',t:'select',opts:listOpts('Engagement Status'),req:1},{k:'aStart',l:'Actual Start Date',t:'date'},{k:'aEnd',l:'Actual End Date (= Final Report Issue Date)',t:'date'}];
  const order = LV('Engagement Status'), next = order[Math.min(order.indexOf(e.status)+1, 4)];
  openForm(`${code} · Update progress`, fields, {status: e.status==='Final Report Issued'?e.status:next, aStart:e.aStart||(e.status==='Not started'?TODAY_S:''), aEnd:e.aEnd}, v=>{
    if (v.aEnd && v.aStart && v.aEnd < v.aStart) return 'Actual End Date must be after Actual Start Date.';
    if (v.status==='Final Report Issued' && !v.aEnd) return 'Enter the Actual End Date (Final Report Issue Date) when the status is Final Report Issued.';
    if (v.aEnd && v.status!=='Final Report Issued') return 'Actual End Date is the Final Report Issue Date, so the status must be Final Report Issued.';
    if (v.status!=='Not started' && !v.aStart && !['Cancelled','Deferred'].includes(v.status)) return 'Enter the Actual Start Date.';
    fields.forEach(f=>{ if ((e[f.k]||'')!==(v[f.k]||'')) log('Annual Plan', code, f.l, e[f.k], v[f.k]); });
    Object.assign(e, v); toast(`${code} moved to ${v.status}`);
  });
}
function newIssue(code){
  const e = L.eng(code);
  const subs = uniq(DB.rcm.filter(r=>r.eng===code).map(r=>r.sub));
  const fields = [
    {k:'sub',l:'Sub-Process',t:'select',opts:()=>(subs.length?subs:DB.processes.filter(p=>p.parent).map(p=>p.code)).map(s=>[s,nm(L.proc,s)]),req:1},
    {k:'obs',l:'Observation',t:'area',req:1,full:1},{k:'rating',l:'Issue Rating',t:'select',opts:listOpts('Issue Rating'),req:1},{k:'type',l:'Issue Type',t:'select',opts:listOpts('Issue Type'),req:1},
    {k:'criteria',l:'Criteria',t:'text',full:1},{k:'root',l:'Root Cause',t:'area',full:1},{k:'rootCat',l:'Root Cause Category',t:'select',opts:listOpts('Root Cause Category')},
    {k:'impact',l:'Impact / Risk',t:'text'},{k:'rec',l:'Recommendation / Action Plan',t:'area',req:1,full:1},
    {k:'pic',l:'Person in charge',t:'select',opts:userOpts,req:1},{k:'due',l:'Due Date',t:'date',req:1}];
  openForm(`${code} · New issue`, fields, {pic:e.owner}, v=>{
    const n = nextCode(`ISS-${code.slice(3)}-`, DB.issues, 'code');
    DB.issues.push({...v, code:n, eng:code, process:(L.proc(v.sub)||{}).parent||'', resp:'', revised:'', completion:'', repeat:'', validatedBy:'', validationDate:''});
    log('Issue Log', n, 'Issue', '', 'Created'); toast(`Created ${n}`);
  });
}
function newMaster(t){
  const m = MASTER[t];
  openForm(`New ${t.toLowerCase()} / Tạo mới`, m.fields, {status:'Active'}, v=>{
    if (m.rows().some(r=>r.code.toLowerCase()===v.code.toLowerCase())) return `Code "${v.code}" already exists. Codes must be unique.`;
    m.rows().push(v); log('Master Data', v.code, t, '', 'Created'); toast(`Created ${t} ${v.code}`);
  });
}
function newUser(){
  const fields = [{k:'code',l:'Code',t:'text',req:1,note:'Employee ID'},{k:'name',l:'Full Name',t:'text',req:1},{k:'email',l:'Email',t:'email',req:1},
    {k:'title',l:'Position / Title',t:'select',opts:listOpts('Position / Title'),req:1},{k:'role',l:'Role',t:'select',opts:listOpts('Role'),req:1},{k:'scope',l:'Data Scope',t:'select',opts:listOpts('Data Scope'),req:1},
    {k:'company',l:'Company',t:'select',opts:()=>DB.companies.map(c=>[c.code,c.name]),req:1,cascade:1},{k:'office',l:'Office',t:'select',opts:v=>DB.offices.filter(o=>o.company===v.company).map(o=>[o.code,o.name]),req:1,cascade:1},
    {k:'dept',l:'Department',t:'select',opts:v=>DB.departments.filter(d=>d.office===v.office).map(d=>[d.code,d.name]),req:1},{k:'status',l:'Status',t:'select',opts:STATUS_OPTS,req:1}];
  openForm('New user / Tạo người dùng', fields, {status:'Active'}, v=>{
    if (DB.users.some(u=>u.code.toLowerCase()===v.code.toLowerCase())) return `Code "${v.code}" already exists.`;
    if (DB.users.some(u=>u.email.toLowerCase()===v.email.toLowerCase())) return `Email "${v.email}" is already used.`;
    DB.users.push(v); log('Administration', v.code, 'User', '', 'Created'); toast(`Created user ${v.name}`);
  });
}

/* =========================================================
   Render + events
   ========================================================= */
const TABS = [['dashboard','Dashboard','Tổng quan',()=>can('dashboard')],['plan','Annual Plan','Kế hoạch năm',()=>can('plan')],['rcm','Risk Control Matrix','Ma trận rủi ro – kiểm soát',()=>can('rcm')],
  ['log','Issue Log','Sổ theo dõi phát hiện',()=>can('log')],['fu','Follow-up','Theo dõi khắc phục',()=>can('fu')],['master','Master Data','Dữ liệu danh mục',()=>can('master')],
  ['admin','Administration','Quản trị hệ thống',()=>can('users')||can('roles')||can('trail')]];
function render(){
  const okTabs = TABS.filter(t=>t[3]());
  if (!okTabs.length){ document.getElementById('nav').innerHTML=''; document.getElementById('main').innerHTML = header('No access','Không có quyền') + '<div class="banner">This role has no modules. Ask the Admin to grant access.</div>'; return; }
  if (!okTabs.find(t=>t[0]===S.tab)){ S.tab = okTabs[0][0]; S.eng = null; }
  if (S.eng && !can('plan')) S.eng = null;
  document.getElementById('nav').innerHTML = okTabs.map(([id,en,vi])=>`<button type="button" data-tab="${id}"${S.tab===id?' aria-current="page"':''}>${esc(en)}<small>${esc(vi)}</small></button>`).join('');
  const views = {dashboard:viewDashboard, plan:()=>S.eng?viewEngagement():viewPlan(), rcm:viewRCM, log:viewLog, fu:viewFU, master:viewMaster, admin:viewAdmin};
  document.getElementById('main').innerHTML = views[S.tab]();
}
function openEng(code){ S.tab='plan'; S.eng=code; S.etab='overview'; S.xq=''; S.xo=''; S.xs=''; render(); window.scrollTo(0,0); }
document.getElementById('nav').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if (b){ S.tab=b.dataset.tab; S.eng=null; try{localStorage.setItem('ia-tab',S.tab);}catch(_){} render(); window.scrollTo(0,0);} });
const main = document.getElementById('main');
main.addEventListener('change', e=>{
  const t = e.target, d = t.dataset;
  if (t.id==='whoSel'){ S.user=t.value; ['dashboard','plan','rcm','log','fu'].forEach(k=>S.f[k]={}); render(); toast(`Now viewing as ${me().name} (${me().role})`); return; }
  if (d.fk){ onFilter(t.closest('[data-fpage]').dataset.fpage, d.fk, t.value); return; }
  if (d.ed){ applyEdit(d.ed, d.key, d.f, t.value); return; }
  if (t.id==='xo'){ S.xo=t.value; render(); return; }
  if (t.id==='xs'){ S.xs=t.value; render(); return; }
  if (d.mp){ const old=MP[d.mp][+d.ri]; MP[d.mp][+d.ri]=t.value; log('Administration','Module Permissions',`${MODS.find(x=>x[0]===d.mp)[1]} · ${ROLES[+d.ri]}`,old,t.value); render(); toast('Module permission updated'); return; }
  if (d.fp){ const old=FP[d.fp][d.f][+d.ri]; FP[d.fp][d.f][+d.ri]=t.value; log('Administration','Field Permissions',`${fieldLabel(d.fp,d.f)} · ${ROLES[+d.ri]}`,old,t.value); render(); toast('Field permission updated'); return; }
  if (d.us){ const u=L.user(d.us), old=u[d.f]; u[d.f]=t.value; log('Administration',u.code,d.f==='scope'?'Data Scope':d.f==='role'?'Role':'Status',old,t.value); if (u.code===S.user) render(); else render(); toast(`Updated ${u.name}`); return; }
  if (d.lv){ const l=DB.lists[+d.lv], v=l.vals[+d.vi], old=v.status; v.status=t.value; log('Master Data',l.name,v.v,old,t.value); render(); toast(`${v.v}: ${t.value}`); return; }
});
main.addEventListener('input', e=>{
  if (e.target.id==='xq'){ S.xq=e.target.value; const box=document.getElementById('xtree'); const en=L.eng(S.eng); if (box&&en) box.innerHTML = execTree(en) || '<div class="empty">No rows.</div>'; }
});
main.addEventListener('click', e=>{
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.freset){ S.f[d.freset]={}; render(); return; }
  if (d.sec){ S.dashSec=d.sec; render(); return; }
  if (d.eng){ openEng(d.eng); return; }
  if (d.go){ S.tab=d.go; S.eng=null; render(); return; }
  if (d.etab){ S.etab=d.etab; render(); return; }
  if (d.tsub){ S.closed.has(d.tsub)?S.closed.delete(d.tsub):S.closed.add(d.tsub); render(); return; }
  if (d.trisk){ S.open.has(d.trisk)?S.open.delete(d.trisk):S.open.add(d.trisk); render(); return; }
  if (d.mtab){ S.mtab=d.mtab; render(); return; }
  if (d.atab){ S.atab=d.atab; render(); return; }
  if (d.pmod){ S.pmod=d.pmod; render(); return; }
  if (d.addlv){ const li=+d.addlv, l=DB.lists[li], c=document.getElementById('nc-'+li).value.trim(), v=document.getElementById('nv-'+li).value.trim(), m=document.getElementById('nm-'+li).value.trim();
    if (!c||!v){ toast('Enter a code and a value.'); return; } if (l.vals.some(x=>x.code===c||x.v===v)){ toast('This code or value already exists.'); return; }
    l.vals.push({code:c,v,m,status:'Active'}); log('Master Data',l.name,'Value','',v); render(); toast(`Added "${v}" to ${l.name}`); return; }
  if (t.id==='addEng'){ newEngagement(); return; }
  if (t.id==='editEng'){ editEngagement(S.eng); return; }
  if (t.id==='updProg'){ updateProgress(S.eng); return; }
  if (t.id==='addIssue'){ newIssue(S.eng); return; }
  if (t.id==='addMaster'){ newMaster(S.mtab); return; }
  if (t.id==='addUser'){ newUser(); return; }
});

try { const s = localStorage.getItem('ia-tab'); if (s) S.tab = s; } catch(_) {}
render();
</script>

</body></html>
